<style>

<body>
<header class="hero"><h1>🧾 家用記帳小工具</h1><p>一眼看懂這個月錢去哪了🌿</p></header>
<noscript><p style="margin:0;padding:12px 16px;background:#FFF4E5;color:#8a5a00;text-align:center;font-size:.95rem;line-height:1.6">這個預覽沒有執行網頁程式，所以無法輸入密碼。請改用 Safari 或 Chrome 開啟。</p></noscript>
<main>
  <form class="gbox" id="gateForm" novalidate>
    <h2>🔒 請輸入密碼</h2>
    <p>這是鯊鯊說心事的家用記帳小工具，請輸入購買時拿到的 6 位數密碼。</p>

    <input id="gateIn" type="password" inputmode="numeric" autocomplete="off" maxlength="6" aria-label="6 位數密碼" placeholder="••••••">

<script>
(function () {
  var GATE_HASH = 'fd15cf42a6710c7d645f90dcdcc5aabfb7a881b99387d989d54045b0932c95ed', GATE_KEY = 'site-gate-v1', SALT = 'shark-household:';
  function sha256(ascii) {                              // 小型 SHA-256（只用來把密碼打亂，不讓原始碼直接看到數字）
    function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
    var mp = Math.pow, mw = mp(2, 32), i, j, res = '', words = [], blen = ascii.length * 8, hash = [], k = [], pc = 0, ic = {};
    for (var c = 2; pc < 64; c++) { if (!ic[c]) { for (i = 0; i < 313; i += c) ic[i] = c; hash[pc] = (mp(c, .5) * mw) | 0; k[pc++] = (mp(c, 1 / 3) * mw) | 0; } }
    hash = hash.slice(0, 8); ascii += '\x80'; while (ascii.length % 64 - 56) ascii += '\x00';
    for (i = 0; i < ascii.length; i++) { j = ascii.charCodeAt(i); words[i >> 2] |= j << ((3 - i) % 4) * 8; }
    words[words.length] = ((blen / mw) | 0); words[words.length] = blen;
    for (j = 0; j < words.length;) {
      var w = words.slice(j, j += 16), oh = hash; hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
        var t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(t1 + t2) | 0].concat(hash); hash[4] = (hash[4] + t1) | 0; hash.length = 8;
      }
      for (i = 0; i < 8; i++) hash[i] = (hash[i] + oh[i]) | 0;
    }
    for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) { var b = (hash[i] >> (j * 8)) & 255; res += (b < 16 ? '0' : '') + b.toString(16); }
    return res;
  }
  var inp = document.getElementById('gateIn'), err = document.getElementById('gateErr');
  inp.addEventListener('input', function () { var v = inp.value.replace(/[０-９]/g, function (ch) { return String.fromCharCode(ch.charCodeAt(0) - 65248); }).replace(/\D/g, '').slice(0, 6); if (inp.value !== v) inp.value = v; err.textContent = ''; });
  document.getElementById('gateForm').addEventListener('submit', function (ev) {
    ev.preventDefault(); var v = inp.value;
    if (v.length !== 6) { err.textContent = '請輸入 6 位數密碼。'; inp.focus(); return; }
    if (sha256(SALT + v) !== GATE_HASH) { err.textContent = '密碼不對，請再試一次。'; inp.value = ''; inp.focus(); return; }
    var ok = false; try { localStorage.setItem(GATE_KEY, GATE_HASH); ok = true; } catch (e) {} if (!ok) { try { sessionStorage.setItem(GATE_KEY, GATE_HASH); } catch (e) {} }
    location.href = '預算規劃.html';
  });
})();
</script>
